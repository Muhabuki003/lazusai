<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content" id="viewport-meta">
<title>Lazusai — Global Intelligence</title>
<meta name="description" content="Real-time global intelligence dashboard with voice-activated AI agents. Conflicts, markets, chokepoints, satellites, and multi-model AI analysis." />
<style>
  :root{
    --void:#020505;
    --ink:#5c7a7c;
    --ink-bright:#d7f3ef;
    --panel-bg:rgba(2,5,5,.88);
    --panel-border:rgba(92,122,124,.2);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--void);font-family:"JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
  body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

  /* ── Dashboard iframe ── */
  #dashboard-frame{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    border:0;
    z-index:0;
    transition:opacity .6s ease, filter .6s ease;
  }

  /* ── Voice overlay ── */
  #voice-overlay{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    transition:all .6s cubic-bezier(.22,1,.36,1);
  }
  #voice-canvas-wrap{
    position:relative;
    width:100%;
    height:100%;
    pointer-events:auto;
    transition:all .6s cubic-bezier(.22,1,.36,1);
  }
  #voice-canvas-wrap canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    cursor:pointer;
  }

  .hud{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:clamp(20px,5vh,52px) 24px;
    pointer-events:none;
    z-index:11;
  }
  .eyebrow{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:11px;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.85;
  }
  .eyebrow .dot{
    width:5px;height:5px;border-radius:50%;
    background:#2ee6d0;
    box-shadow:0 0 10px #2ee6d0;
    transition:background .5s, box-shadow .5s;
  }
  body[data-state="listening"] .eyebrow .dot{background:#ffb03a;box-shadow:0 0 12px #ffb03a}
  body[data-state="thinking"]  .eyebrow .dot{background:#7c5cff;box-shadow:0 0 12px #7c5cff}
  body[data-state="speaking"]  .eyebrow .dot{background:#b06cff;box-shadow:0 0 14px #b06cff}

  .transcript{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    max-width:min(620px,86vw);
    max-height:clamp(120px,25vh,320px);
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
    scrollbar-color:rgba(92,122,124,.25) transparent;
    text-align:center;
    margin-bottom:clamp(14px,4vh,32px);
    pointer-events:auto;
  }
  .transcript::-webkit-scrollbar{width:3px}
  .transcript::-webkit-scrollbar-track{background:transparent}
  .transcript::-webkit-scrollbar-thumb{background:rgba(92,122,124,.25);border-radius:2px}
  .turn{
    font-size:13px;
    line-height:1.65;
    letter-spacing:.02em;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .4s ease, transform .4s ease;
    width:100%;
    word-break:break-word;
  }
  .turn.show{opacity:1;transform:translateY(0)}
  .turn.you{color:rgba(215,243,239,.42);font-size:12px;letter-spacing:.06em}
  .turn.hermes{color:var(--ink-bright)}
  .turn.error{color:#ff6b5a}

  .bottom{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .label{
    font-size:12px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--ink-bright);
    opacity:0;
    transform:translateY(4px);
    transition:opacity .35s ease, transform .35s ease;
  }
  .label.show{opacity:1;transform:translateY(0)}
  .meter{display:flex;gap:3px;align-items:flex-end;height:16px}
  .meter i{
    display:block;width:3px;height:3px;
    background:rgba(92,122,124,.32);
    transition:height .07s linear, background .07s linear;
  }
  .hint{
    font-size:10.5px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:rgba(92,122,124,.6);
    pointer-events:auto;
    cursor:pointer;
  }
  .composer{
    display:none;
    pointer-events:auto;
    width:min(460px,84vw);
  }
  .composer.on{display:block}
  .composer input{
    width:100%;
    background:rgba(215,243,239,.04);
    border:1px solid rgba(92,122,124,.35);
    border-radius:2px;
    color:var(--ink-bright);
    font-family:inherit;
    font-size:16px;
    letter-spacing:.04em;
    padding:10px 14px;
    outline:none;
    -webkit-user-select:text;user-select:text;
  }
  .composer input:focus{border-color:rgba(46,230,208,.6)}
  .composer input::placeholder{color:rgba(92,122,124,.55)}

  /* ── Mode controls ── */
  #mode-controls{
    position:fixed;
    top:clamp(20px,5vh,52px);
    right:24px;
    z-index:20;
    display:flex;
    gap:6px;
    pointer-events:auto;
    opacity:0;
    transform:translateY(-8px);
    transition:opacity .5s ease .8s, transform .5s ease .8s;
  }
  body[data-loaded="true"] #mode-controls{opacity:1;transform:translateY(0)}
  .mode-btn{
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    border-radius:2px;
    color:var(--ink);
    font-family:inherit;
    font-size:9px;
    letter-spacing:.12em;
    text-transform:uppercase;
    padding:6px 10px;
    cursor:pointer;
    transition:all .25s ease;
  }
  .mode-btn:hover{border-color:rgba(46,230,208,.4);color:var(--ink-bright)}
  .mode-btn.active{background:rgba(46,230,208,.1);border-color:rgba(46,230,208,.5);color:#2ee6d0}

  /* ── Mode: Voice Full ── */
  body[data-mode="voice-full"] #dashboard-frame{
    opacity:0;
    filter:blur(8px);
    pointer-events:none;
  }
  body[data-mode="voice-full"] #voice-overlay{
    pointer-events:auto;
  }

  /* ── Mode: Dashboard Full ── */
  body[data-mode="dash-full"] #voice-overlay{
    pointer-events:none;
  }
  body[data-mode="dash-full"] #voice-canvas-wrap{
    position:fixed;
    bottom:24px;
    right:24px;
    width:80px;
    height:80px;
    pointer-events:auto;
    z-index:15;
    cursor:pointer;
  }
  body[data-mode="dash-full"] #voice-canvas-wrap canvas{
    border-radius:50%;
    border:1px solid var(--panel-border);
  }
  body[data-mode="dash-full"] .transcript,
  body[data-mode="dash-full"] .bottom .label,
  body[data-mode="dash-full"] .bottom .hint,
  body[data-mode="dash-full"] .meter{
    display:none !important;
  }
  body[data-mode="dash-full"] .hud{
    justify-content:flex-end;
    padding:0 24px 110px 24px;
  }
  body[data-mode="dash-full"] .eyebrow{
    position:fixed;
    bottom:112px;
    right:36px;
    z-index:16;
  }
  body[data-mode="dash-full"] .composer{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:min(500px,90vw);
    z-index:16;
  }

  /* ── Mode: Split (default) ── */
  body[data-mode="split"] #dashboard-frame{
    opacity:.35;
    filter:blur(2px) brightness(.5);
    pointer-events:none;
  }
  body[data-mode="split"] #voice-overlay{
    pointer-events:auto;
  }
  body[data-mode="split"] #voice-canvas-wrap{
    pointer-events:auto;
  }

  /* ── Hide voice text ── */
  body[data-hidetext="true"] .transcript,
  body[data-hidetext="true"] .hud .label,
  body[data-hidetext="true"] .hud .hint,
  body[data-hidetext="true"] .meter{
    display:none !important;
  }
  body[data-hidetext="true"] .hud{
    justify-content:center;
  }

  /* ── Dark overlay when dashboard is blurred ── */
  #dash-overlay{
    position:fixed;
    inset:0;
    z-index:5;
    background:radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(2,5,5,.6) 100%);
    pointer-events:none;
    transition:opacity .6s ease;
  }
  body[data-mode="dash-full"] #dash-overlay{opacity:0}

  @media (prefers-reduced-motion:reduce){
    .label,.turn{transition:none}
    #voice-overlay,#dashboard-frame,#mode-controls{transition:none}
  }
</style>
</head>
<body data-state="idle" data-hidetext="false" data-mode="split" data-loaded="false">

  <!-- Dashboard iframe -->
  <iframe id="dashboard-frame" src="https://www.worldmonitor.app/dashboard" allow="geolocation;microphone;camera" loading="eager"></iframe>
  <div id="dash-overlay"></div>

  <!-- Mode controls -->
  <div id="mode-controls">
    <button class="mode-btn active" data-mode="split" onclick="setMode('split')">Split</button>
    <button class="mode-btn" data-mode="voice-full" onclick="setMode('voice-full')">Voice</button>
    <button class="mode-btn" data-mode="dash-full" onclick="setMode('dash-full')">Dash</button>
  </div>

  <!-- Voice overlay -->
  <div id="voice-overlay">
    <div id="voice-canvas-wrap">
      <canvas id="c"></canvas>
    </div>
    <div class="hud">
      <div class="eyebrow"><span class="dot"></span><span>Lazusai · Voice</span></div>
      <div class="bottom">
        <div class="transcript">
          <p class="turn you" id="turn-you"></p>
          <p class="turn hermes" id="turn-hermes"></p>
        </div>
        <span class="label" id="label">Idle</span>
        <span class="meter" id="meter"></span>
        <form class="composer" id="composer" autocomplete="off">
          <input id="composer-input" type="text" placeholder="Ask Lazusai…" enterkeyhint="send">
        </form>
        <p class="hint" id="hint">Tap anywhere to speak</p>
      </div>
    </div>
  </div>

<script>
(() => {
  'use strict';

  /* ── Mode switching ── */
  window.setMode = function(mode){
    document.body.dataset.mode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
  };

  /* ── Mark loaded ── */
  setTimeout(() => { document.body.dataset.loaded = 'true'; }, 500);

  /* ── Canvas setup ── */
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const label  = document.getElementById('label');
  const hint   = document.getElementById('hint');
  const meter  = document.getElementById('meter');
  const turnYou    = document.getElementById('turn-you');
  const turnHermes = document.getElementById('turn-hermes');
  const composer      = document.getElementById('composer');
  const composerInput = document.getElementById('composer-input');

  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  const STEP_RAD = TAU / 6;

  let W = 0, H = 0, CX = 0, CY = 0, DPR = 1, UNIT = 1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2;
    CY = H / 2;
    UNIT = Math.max(W, H) / 46;
    ctx.fillStyle = '#020505';
    ctx.fillRect(0, 0, W, H);
  }

  const PRESETS = {
    idle: { hue:172, hueSpread:24, count:REDUCED?26:56, step:16, flow:0, reach:15, glow:.5, fade:.05, blur:7, spark:.04, light:52 },
    listening: { hue:38, hueSpread:14, count:REDUCED?34:84, step:8, flow:-1, reach:24, glow:.85, fade:.075, blur:11, spark:.1, light:58 },
    thinking: { hue:266, hueSpread:26, count:REDUCED?32:76, step:6, flow:-1, reach:19, glow:.78, fade:.085, blur:9, spark:.07, light:56 },
    speaking: { hue:186, hueSpread:44, count:REDUCED?36:96, step:7, flow:1, reach:26, glow:1, fade:.058, blur:13, spark:.13, light:60 }
  };
  const P = Object.assign({}, PRESETS.idle);
  let state = 'idle', level = 0, tick = 0, breathe = 0;

  /* ── Particle system (same as Hermes Voice) ── */
  function Line(){ this.reset(true); }
  Line.prototype.reset = function(scatter){
    if (P.flow < 0){
      const a = Math.random() * TAU;
      const r = P.reach * (scatter ? .3 + Math.random() * .7 : 1);
      this.x = Math.cos(a) * r; this.y = Math.sin(a) * r;
    } else {
      const a = Math.random() * TAU;
      const j = scatter ? Math.random() * (P.flow === 0 ? P.reach * .8 : 3) : 0;
      this.x = Math.cos(a) * j; this.y = Math.sin(a) * j;
    }
    this.ax = 0; this.ay = 0;
    this.rad = Math.floor(Math.random() * 6) * STEP_RAD;
    this.lightRate = .012 + .022 * Math.random();
    this.hueOffset = (Math.random() - .5) * 2;
    this.age = 0;
    this.beginPhase();
  };
  Line.prototype.beginPhase = function(){
    this.x += this.ax; this.y += this.ay;
    this.t = 0;
    this.target = Math.max(3, (P.step + P.step * .8 * Math.random()) | 0);
    const rA = this.rad + STEP_RAD, rB = this.rad - STEP_RAD;
    const dA = Math.hypot(this.x + Math.cos(rA), this.y + Math.sin(rA));
    const dB = Math.hypot(this.x + Math.cos(rB), this.y + Math.sin(rB));
    this.rad = Math.random() < .5 + .45 * P.flow ? (dA > dB ? rA : rB) : (dA > dB ? rB : rA);
    this.ax = Math.cos(this.rad); this.ay = Math.sin(this.rad);
    if (Math.hypot(this.x, this.y) > P.reach || (P.flow < 0 && Math.hypot(this.x, this.y) < .8) || Math.random() < .03)
      this.reset(false);
  };
  Line.prototype.step = function(){
    this.t++; this.age++;
    if (this.t >= this.target) this.beginPhase();
    const prop = this.t / this.target;
    const wave = Math.sin(prop * Math.PI / 2);
    const px = CX + (this.x + this.ax * wave) * UNIT;
    const py = CY + (this.y + this.ay * wave) * UNIT;
    const hue = P.hue + this.hueOffset * P.hueSpread;
    const li  = P.light + 12 * Math.sin(this.age * this.lightRate);
    const col = 'hsla(' + hue.toFixed(0) + ',100%,' + li.toFixed(0) + '%,' + P.glow.toFixed(3) + ')';
    ctx.shadowBlur = prop * P.blur;
    ctx.shadowColor = col;
    ctx.fillStyle = col;
    ctx.fillRect(px, py, 2, 2);
    if (Math.random() < P.spark){
      const d = 10;
      ctx.fillRect(px + (Math.random() - .5) * d * 2, py + (Math.random() - .5) * d * 2, 2, 2);
    }
  };
  const lines = [];

  /* ── Rings ── */
  const rings = [];
  function emitRing(strength){
    rings.push({ r: UNIT * 2, a: .5 * strength, rot: Math.random() * STEP_RAD, v: 2.2 + strength * 5.2 });
    if (rings.length > 10) rings.shift();
  }
  function hexPath(cx, cy, r, rot){
    ctx.beginPath();
    for (let k = 0; k < 6; k++){
      const a = rot + k * STEP_RAD;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
  }
  function drawRings(){
    const max = Math.hypot(W, H) * .58;
    for (let i = rings.length - 1; i >= 0; i--){
      const g = rings[i];
      g.r += g.v; g.a *= .965;
      if (g.a < .01 || g.r > max){ rings.splice(i, 1); continue; }
      hexPath(CX, CY, g.r, g.rot);
      const col = 'hsla(' + P.hue.toFixed(0) + ',100%,66%,' + g.a.toFixed(3) + ')';
      ctx.strokeStyle = col; ctx.shadowColor = col;
      ctx.shadowBlur = 18; ctx.lineWidth = 1.2; ctx.stroke();
    }
  }

  function drawCore(){
    if (state === 'speaking') return;
    const r = UNIT * 1.2 + Math.sin(breathe) * UNIT * .2;
    const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, r);
    grad.addColorStop(0, 'hsla(' + P.hue + ',100%,58%,.28)');
    grad.addColorStop(1, 'hsla(' + P.hue + ',100%,58%,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(CX, CY, r, 0, TAU); ctx.fill();
  }

  function setState(s){
    state = s;
    document.body.dataset.state = s;
    Object.assign(P, PRESETS[s] || PRESETS.idle);
    // re-spawn lines on count change
    while (lines.length < P.count) lines.push(new Line());
    if (lines.length > P.count) lines.length = P.count;
    if ('label' in window) label.textContent = s.charAt(0).toUpperCase() + s.slice(1);
    label.classList.add('show');
  }

  function loop(){
    tick++;
    breathe = tick * .02;
    ctx.clearRect(0, 0, W, H);

    // Draw particles
    for (let i = 0; i < lines.length; i++) lines[i].step();
    drawRings();
    drawCore();

    // Meter
    const bars = meter.children;
    for (let i = 0; i < bars.length; i++){
      const h = state === 'listening' ? 3 + Math.random() * 13 : 3;
      bars[i].style.height = h + 'px';
      bars[i].style.background = 'hsla(' + P.hue + ',80%,60%,' + (.2 + h / 20 * .5) + ')';
    }

    requestAnimationFrame(loop);
  }

  /* ── Audio / Mic ── */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null;
  let audioCtx = null;
  let analyserNode = null;
  let micStream = null;
  let externalLevel = null;
  let inflight = null;
  let history = [];

  function ensureAudioCtx(){
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
  }

  function buildMeter(){
    for (let i = 0; i < 16; i++){
      const bar = document.createElement('i');
      meter.appendChild(bar);
    }
  }

  function beginListening(){
    if (!SR){ openComposer(); return; }
    if (recognizer) recognizer.abort();
    recognizer = new SR();
    recognizer.lang = 'en-US';
    recognizer.continuous = false;
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;

    // Start mic for meter
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        micStream = stream;
        ensureAudioCtx();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        const src = audioCtx.createMediaStreamSource(stream);
        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 128;
        src.connect(analyserNode);
      }).catch(() => {});
    }

    recognizer.onresult = function(e){
      const text = e.results[0][0].transcript;
      showTurn(turnYou, text);
      finishListening();
      send(text);
    };
    recognizer.onerror = function(e){
      if (e.error === 'aborted' || e.error === 'no-speech') return;
      if (e.error === 'not-allowed'){ hint.textContent = 'Microphone blocked — tap to type'; openComposer(); return; }
      openComposer();
    };
    recognizer.start();
    setState('listening');
  }

  function stopRecognition(){
    if (recognizer){ try { recognizer.abort(); } catch(_){} recognizer = null; }
  }

  function stopMic(){
    if (micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  }

  function finishListening(){
    stopRecognition();
    // Keep mic running for thinking animation
  }

  function showTurn(el, text, isError){
    el.textContent = text;
    el.className = 'turn show' + (isError ? ' error' : '');
  }

  function setHideText(val){
    const hidden = val === true || val === 'true';
    document.body.dataset.hidetext = String(hidden);
  }

  async function send(text, attempt){
    attempt = attempt || 0;
    history.push({ role: 'user', content: text });
    cancelRequest();
    const controller = new AbortController();
    inflight = controller;
    setState('thinking');

    // Keep mic going so the animation breathes
    try {
      const resp = await fetch('https://hermes-voice-86h.pages.dev/api/hermes/voice', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, history: history.slice(-20) }),
        signal: controller.signal
      });

      // Handle silent commands
      if (resp.headers.get('X-Command') === 'hide_text'){
        setHideText(true); return;
      }
      if (resp.headers.get('X-Command') === 'show_text'){
        setHideText(false); return;
      }

      const data = await resp.json();

      // Handle command-like responses
      if (data.command === 'hide_text' && data.silent){ setHideText(true); setState('idle'); return; }
      if (data.command === 'show_text' && data.silent){ setHideText(false); setState('idle'); return; }

      const reply = data.response || '...';
      history.push({ role: 'assistant', content: reply });
      showTurn(turnHermes, reply);
      setState('speaking');

      // Play audio
      if (data.audio_url){
        const a = new Audio(data.audio_url);
        a.onended = () => setState('idle');
        a.onerror = () => setState('idle');
        a.play().catch(() => setState('idle'));
      } else {
        setTimeout(() => setState('idle'), 500);
      }
    } catch (e){
      if (e.name === 'AbortError') return;
      if (attempt < 2 && (e.name === 'TypeError' || String(e.message).includes('fetch'))){
        const delay = 2000 * Math.pow(2, attempt);
        await new Promise(resolve => setTimeout(resolve, delay));
        return send(text, attempt + 1);
      }
      showTurn(turnHermes, e.message, true);
      setState('idle');
    } finally {
      inflight = null;
    }
  }

  function cancelRequest(){
    if (inflight) inflight.abort();
    inflight = null;
    setState('idle');
  }

  function openComposer(){
    composer.classList.add('on');
    composerInput.focus();
    if (!SR) hint.textContent = 'Speech input unavailable — type instead';
  }
  function closeComposer(){ composer.classList.remove('on'); composerInput.blur(); }

  composer.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = composerInput.value.trim();
    if (!text) return;
    composerInput.value = '';
    composerInput.blur();
    send(text);
  });

  /* ── Interaction ── */
  let activePointers = 0;
  let multiTouchAt = 0;
  document.addEventListener('pointerdown', () => {
    activePointers++;
    if (activePointers > 1) multiTouchAt = Date.now();
  }, true);
  document.addEventListener('pointerup', () => { activePointers = Math.max(0, activePointers - 1); });
  document.addEventListener('pointercancel', () => { activePointers = Math.max(0, activePointers - 1); });

  function handleTap(e){
    if (e) e.preventDefault();
    if (Date.now() - multiTouchAt < 350) return;
    if (activePointers > 1) return;
    if (composer.classList.contains('on')){ closeComposer(); return; }

    if (state === 'idle')           beginListening();
    else if (state === 'listening') finishListening();
    else if (state === 'thinking')  cancelRequest();
    else                            stopSpeaking();
  }

  function stopSpeaking(){
    if (window.synth) window.synth.cancel();
    setState('idle');
  }

  canvas.addEventListener('click', handleTap);
  hint.addEventListener('click', (e) => {
    e.stopPropagation();
    composer.classList.contains('on') ? closeComposer() : openComposer();
  });
  window.addEventListener('keydown', e => {
    if (document.activeElement === composerInput){
      if (e.key === 'Escape') closeComposer();
      return;
    }
    if (e.code === 'Space' && !e.repeat) handleTap(e);
    if (e.key === 't' || e.key === 'T') { openComposer(); }
    // Mode shortcuts
    if (e.key === '1') setMode('split');
    if (e.key === '2') setMode('voice-full');
    if (e.key === '3') setMode('dash-full');
  });

  window.addEventListener('resize', resize);
  buildMeter();
  resize();
  setState('idle');
  loop();

  /* ── Public API ── */
  window.Lazusai = {
    setState, setMode, setHideText, send,
    get state(){ return state; },
    get mode(){ return document.body.dataset.mode; }
  };
})();
</script>
</body>
</html>
