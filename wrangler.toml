name = "lazusai"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"

# KV holds routing (route:<id> -> client_id), client config (client:<id>) and
# dashboard credentials (auth:<id>). Create it once:
#   npx wrangler kv namespace create CLIENTS_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "CLIENTS_KV"
id = "452fbbb7ec0a47febddea03440193f1d"

# The admin dashboard is compiled into the Pages bundle by `npm run build`,
# which reads admin/dashboard.html into dist/_worker.js. Always run
# the build before deploy (npm run deploy does both).

# Env vars are configured in the Cloudflare dashboard (project → Settings →
# Environment variables) — the source of truth for ALL deployments. Keeping
# a [vars] block here would REPLACE the dashboard env on git builds and drop
# LAZUSAI_CORE_KEY / N8N_API_KEY (breaking /webhook and /api/*). Do not add
# [vars] back.
