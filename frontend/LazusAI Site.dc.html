  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends

    // contexts such as a sandboxed preview iframe) — location.origin is

      // and sender identity (own child frame / direct parent) is checked

    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};

      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

    setStatus('Unpacking ' + uuids.length + ' assets...');

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

    // consumers read these Blobs directly. Survives the swap like the error sink.

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than

    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

        const m = MARKER.exec(el.getAttribute('src') || '');

        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();

      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

ops=\"{&quot;showGridLines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Design&quot;},&quot;showAnnouncement&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Design&quot;},&quot;chatSpeed&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Relaxed&quot;,&quot;Normal&quot;,&quot;Fast&quot;],&quot;default&quot;:&quot;Relaxed&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.timers = [];\n    this.reveals();\n    this.words();\n    this.counts();\n    this.chat();\n    this.cards();\n    this.faq();\n    this.scroll();\n    this.apply();\n    this.responsive();\n    this.menu();\n    this._onResize = () => this.responsive();\n    window.addEventListener('resize', this._onResize, { passive: true });\n  }\n  componentDidUpdate(prev) {\n    if (prev.showGridLines !== this.props.showGridLines || prev.showAnnouncement !== this.props.showAnnouncement) this.apply();\n    if (prev.chatSpeed !== this.props.chatSpeed) { this.stopChat(); this.chat(); }\n  }\n  componentWillUnmount() { this.stopChat(); if (this._onResize) window.removeEventListener('resize', this._onResize); }\n\n  responsive() {\n    const root = document.querySelector('[data-root]');\n    if (!root) return;\n    const w = window.innerWidth;\n    const mob = w <= 860, tiny = w <= 560;\n\n    if (!this._cache) {\n      this._cache = {\n        grids: [...root.querySelectorAll('*')].filter(el => el.style.gridTemplateColumns).map(el => ({ el, v: el.style.gridTemplateColumns, gap: el.style.gap, stat: !!el.querySelector('[data-count]') })),\n        pads: [...root.querySelectorAll('main > section, footer > div, [data-nav] > div')].map(el => ({ el, v: el.style.padding })),\n        gaps: [...root.querySelectorAll('main > section > div')].filter(el => el.style.gap && el.style.display === 'grid').map(el => ({ el, v: el.style.gap }))\n      };\n    }\n\n    this._cache.grids.forEach(g => {\n      g.el.style.gridTemplateColumns = mob ? (g.stat && !tiny ? '1fr 1fr' : '1fr') : g.v;\n    });\n    this._cache.gaps.forEach(g => { g.el.style.gap = mob && g.v && g.v !== '1px' ? '34px' : g.v; });\n    this._cache.pads.forEach(p => {\n      if (!mob) { p.el.style.padding = p.v; return; }\n      const parts = (p.v || '').trim().split(/\\s+/);\n      if (!parts.length || !parts[0]) return;\n      const px = tiny ? '18px' : '24px';\n      if (parts.length === 1) p.el.style.padding = parts[0];\n      else if (parts.length === 2) p.el.style.padding = this.shrinkV(parts[0]) + ' ' + px;\n      else if (parts.length === 3) p.el.style.padding = this.shrinkV(parts[0]) + ' ' + px + ' ' + this.shrinkV(parts[2]);\n      else p.el.style.padding = this.shrinkV(parts[0]) + ' ' + px + ' ' + this.shrinkV(parts[2]) + ' ' + px;\n    });\n\n    const navRow = document.querySelector('[data-nav] > div');\n    if (navRow) {\n      const kids = navRow.children;\n      if (kids[1]) kids[1].style.display = w <= 1040 ? 'none' : 'flex';\n      if (kids[2] && kids[2].children[0]) kids[2].children[0].style.display = tiny ? 'none' : 'inline-flex';\n      navRow.style.height = mob ? '60px' : '68px';\n    }\n    const tog = document.querySelector('[data-navtoggle]'), panel = document.querySelector('[data-navpanel]');\n    if (tog) tog.style.display = w <= 1040 ? 'grid' : 'none';\n    if (panel && w > 1040) { panel.style.display = 'none'; this._menuOpen = false; if (tog) tog.textContent = '\\u2630'; }\n    const ann = document.querySelector('[data-announce]');\n    if (ann && this.props.showAnnouncement !== false) ann.style.display = tiny ? 'none' : 'flex';\n    const top = document.querySelector('#top');\n    if (top) top.style.paddingTop = (this.props.showAnnouncement === false || tiny ? (mob ? 60 : 68) : (mob ? 98 : 106)) + 'px';\n\n    const main = document.querySelector('main');\n    if (main) { main.style.borderLeftWidth = mob ? '0' : '1px'; main.style.borderRightWidth = mob ? '0' : '1px'; }\n    root.querySelectorAll('[data-grid]').forEach(el => { el.style.backgroundImage = 'repeating-linear-gradient(90deg,#d6d6d2 0 1px,transparent 1px ' + (mob ? 56 : 88) + 'px)'; });\n    root.querySelectorAll('footer > div').forEach(el => { el.style.borderLeftWidth = mob ? '0' : '1px'; el.style.borderRightWidth = mob ? '0' : '1px'; el.style.justifyContent = mob ? 'flex-start' : 'space-between'; });\n    document.querySelectorAll('[data-msg]').forEach(el => { el.style.maxWidth = tiny ? '92%' : '84%'; });\n  }\n\n  menu() {\n    const tog = document.querySelector('[data-navtoggle]'), panel = document.querySelector('[data-navpanel]');\n    if (!tog || !panel) return;\n    const set = open => {\n      this._menuOpen = open;\n      panel.style.display = open ? 'flex' : 'none';\n      tog.textContent = open ? '\\u2715' : '\\u2630';\n      tog.style.borderColor = open ? '#9a9a9a' : '#d6d6d2';\n    };\n    tog.addEventListener('click', () => set(!this._menuOpen));\n    panel.querySelectorAll('[data-navpanel-link]').forEach(a => a.addEventListener('click', () => set(false)));\n  }\n\n  shrinkV(v) {\n    const n = parseFloat(v);\n    if (isNaN(n)) return v;\n    return Math.max(n <= 12 ? n : 22, Math.round(n * 0.62)) + 'px';\n  }\n\n  apply() {\n    const grid = this.props.showGridLines !== false;\n    document.querySelectorAll('[data-grid]').forEach(el => { el.style.display = grid ? 'block' : 'none'; });\n    const ann = document.querySelector('[data-announce]');\n    if (ann) ann.style.display = this.props.showAnnouncement === false ? 'none' : 'flex';\n    const main = document.querySelector('#top');\n    if (main) main.style.paddingTop = this.props.showAnnouncement === false ? '68px' : '106px';\n    if (this._cache) this.responsive();\n  }\n\n  reveals() {\n    const io = new IntersectionObserver(es => {\n      es.forEach(e => {\n        if (!e.isIntersecting) return;\n        const el = e.target, d = +(el.dataset.rvd || 0);\n        setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'none'; }, d);\n        io.unobserve(el);\n      });\n    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n    document.querySelectorAll('[data-rv]').forEach(el => io.observe(el));\n  }\n\n  words() {\n    document.querySelectorAll('[data-words]').forEach(el => {\n      const parts = el.textContent.trim().split(/\\s+/);\n      el.textContent = '';\n      parts.forEach((w, i) => {\n        const outer = document.createElement('span');\n        outer.style.cssText = 'display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.06em';\n        const inner = document.createElement('span');\n        inner.textContent = w;\n        inner.style.cssText = 'display:inline-block;transform:translateY(108%);transition:transform .95s cubic-bezier(.16,.84,.44,1)';\n        outer.appendChild(inner);\n        el.appendChild(outer);\n        if (i < parts.length - 1) el.appendChild(document.createTextNode(' '));\n        setTimeout(() => { inner.style.transform = 'none'; }, 140 + i * 95);\n      });\n    });\n  }\n\n  counts() {\n    const io = new IntersectionObserver(es => {\n      es.forEach(e => {\n        if (!e.isIntersecting) return;\n        io.unobserve(e.target);\n        const el = e.target, target = parseFloat(el.dataset.count), suf = el.dataset.suffix || '', t0 = performance.now(), dur = 1500;\n        const tick = t => {\n          const p = Math.min((t - t0) / dur, 1);\n          el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))) + suf;\n          if (p < 1) requestAnimationFrame(tick); else el.textContent = target + suf;\n        };\n        requestAnimationFrame(tick);\n      });\n    }, { threshold: 0.5 });\n    document.querySelectorAll('[data-count]').forEach(el => io.observe(el));\n  }\n\n  stopChat() { (this.timers || []).forEach(clearTimeout); this.timers = []; if (this.chatIO) this.chatIO.disconnect(); }\n\n  chat() {\n    const wrap = document.querySelector('[data-chat]');\n    if (!wrap) return;\n    const msgs = Array.from(wrap.querySelectorAll('[data-msg]'));\n    const typing = wrap.querySelector('[data-typing]');\n    const speeds = { Relaxed: 1.35, Normal: 1, Fast: 0.68 };\n    const k = speeds[this.props.chatSpeed] || 1;\n    const wait = (fn, ms) => { this.timers.push(setTimeout(fn, ms * k)); };\n    let i = 0;\n    const hide = () => { msgs.forEach(m => { m.style.opacity = '0'; m.style.transform = 'translateY(12px) scale(.97)'; }); if (typing) typing.style.display = 'none'; };\n    const step = () => {\n      if (i >= msgs.length) {\n        if (typing) typing.style.display = 'flex';\n        wait(() => { i = 0; hide(); step(); }, 3800);\n        return;\n      }\n      const m = msgs[i], ai = m.dataset.msg === 'ai';\n      if (typing) typing.style.display = ai ? 'flex' : 'none';\n      wait(() => {\n        m.style.opacity = '1'; m.style.transform = 'none';\n        if (typing) typing.style.display = 'none';\n        i++; step();\n      }, ai ? 1450 : 750);\n    };\n    this.chatIO = new IntersectionObserver(es => {\n      es.forEach(e => { if (e.isIntersecting) { this.chatIO.disconnect(); hide(); step(); } });\n    }, { threshold: 0.3 });\n    this.chatIO.observe(wrap);\n  }\n\n  cards() {\n    document.querySelectorAll('[data-card]').forEach(card => {\n      const glow = card.querySelector('[data-glow]');\n      const arrow = card.querySelector('[data-arrowbox]');\n      card.addEventListener('mousemove', e => {\n        const r = card.getBoundingClientRect();\n        if (glow) glow.style.background = 'radial-gradient(460px circle at ' + (e.clientX - r.left) + 'px ' + (e.clientY - r.top) + 'px, rgba(232,49,42,.11), transparent 46%)';\n      });\n      card.addEventListener('mouseenter', () => {\n        if (glow) glow.style.opacity = '1';\n        card.style.background = '#f5f5f2';\n        if (arrow) { arrow.style.opacity = '1'; arrow.style.transform = 'none'; }\n      });\n      card.addEventListener('mouseleave', () => {\n        if (glow) glow.style.opacity = '0';\n        card.style.background = '#fff';\n        if (arrow) { arrow.style.opacity = '0'; arrow.style.transform = 'translateX(-6px)'; }\n      });\n    });\n    document.querySelectorAll('[data-arrow]').forEach(a => {\n      const host = a.closest('a');\n      if (!host) return;\n      host.addEventListener('mouseenter', () => { a.style.transform = 'translateX(5px)'; });\n      host.addEventListener('mouseleave', () => { a.style.transform = 'none'; });\n    });\n    document.querySelectorAll('[data-step]').forEach(s => {\n      s.addEventListener('mouseenter', () => { s.style.background = '#f5f5f2'; });\n      s.addEventListener('mouseleave', () => { s.style.background = '#fff'; });\n    });\n  }\n\n  faq() {\n    const items = Array.from(document.querySelectorAll('[data-faq]'));\n    const close = it => {\n      const a = it.querySelector('[data-faq-a]'), p = it.querySelector('[data-faq-plus]');\n      a.style.maxHeight = '0'; p.style.transform = 'none'; it.dataset.open = '0';\n    };\n    const open = it => {\n      const a = it.querySelector('[data-faq-a]'), p = it.querySelector('[data-faq-plus]');\n      a.style.maxHeight = a.scrollHeight + 'px'; p.style.transform = 'rotate(45deg)'; it.dataset.open = '1';\n    };\n    items.forEach(it => {\n      it.querySelector('[data-faq-q]').addEventListener('click', () => {\n        const wasOpen = it.dataset.open === '1';\n        items.forEach(close);\n        if (!wasOpen) open(it);\n      });\n    });\n    if (items[0]) open(items[0]);\n  }\n\n  scroll() {\n    const nav = document.querySelector('[data-nav]');\n    const bar = document.querySelector('[data-progress]');\n    const onScroll = () => {\n      const y = window.scrollY;\n      if (nav) {\n        nav.style.borderBottomColor = y > 20 ? '#d6d6d2' : '#ededea';\n        nav.style.background = y > 20 ? 'rgba(255,255,255,.9)' : 'transparent';\n      }\n      if (bar) {\n        const h = document.documentElement.scrollHeight - window.innerHeight;\n        bar.style.width = (h > 0 ? (y / h) * 100 : 0) + '%';\n      }\n    };\n    window.addEventListener('scroll', onScroll, { passive: true });\n    onScroll();\n    document.querySelectorAll('a[href^=\"#\"]').forEach(a => {\n      a.addEventListener('click', e => {\n        const t = document.querySelector(a.getAttribute('href'));\n        if (!t) return;\n        e.preventDefault();\n        window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 100, behavior: 'smooth' });\n      });\n    });\n    document.querySelectorAll('nav a').forEach(a => {\n      if (a.getAttribute('href') && a.getAttribute('href').startsWith('#') && !a.querySelector('[data-arrow]')) {\n        a.addEventListener('mouseenter', () => { a.style.color = '#0d0d0d'; });\n        a.addEventListener('mouseleave', () => { a.style.color = '#5f5f5f'; });\n      }\n    });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
